<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Siraq - Login</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
  </head>
  <body class="center-body">
    <div id="auth-section" class="glass-panel text-center">
      <img src="image_0601b3.jpg" alt="Logo" class="logo" />
      <h2 id="auth-title">Masuk ke Siraq</h2>
      <p class="subtitle" id="auth-subtitle">Silakan login untuk memesan</p>

      <input type="email" id="email" placeholder="Email Anda" />
      <input type="password" id="password" placeholder="Password" />

      <div id="login-buttons">
        <button onclick="login()" class="btn-primary">Login</button>
        <p class="switch-auth">
          Belum punya akun?
          <span onclick="toggleAuthMode()">Daftar di sini</span>
        </p>
      </div>
      <div id="register-buttons" style="display: none">
        <button onclick="register()" class="btn-secondary">
          Daftar Akun Baru
        </button>
        <p class="switch-auth">
          Sudah punya akun?
          <span onclick="toggleAuthMode()">Login di sini</span>
        </p>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
